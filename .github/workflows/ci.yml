# İstanbul Nabız — continuous integration.
#
# Three jobs, all offline: the repository is public and holds no secrets, so nothing here
# reads `secrets.*` and nothing deploys. See .github/workflows/README.md for why deployment
# is a laptop command (`azd deploy`) rather than a workflow, for the ruff-format decision
# encoded below, and for what the authorship gate does and does not check.
#
# Every third-party action is pinned to a full commit SHA, with its release in a comment,
# and uv to the SHA-256 of its wheels (.github/requirements-uv.txt). A tag such as `v5` or a
# versioned installer URL can serve different code at any time; a hash cannot.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: this workflow only ever looks at the tree it checked out.
permissions:
  contents: read

# A newer push to a pull request makes the older run pointless, so it is cancelled. On main
# every run is kept: a cancelled run leaves that commit with no verdict, and "which commit
# turned main red" is exactly the question a run on main exists to answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # PyPI is slow from some networks; give uv room before it gives up.
  UV_HTTP_TIMEOUT: "180"
  # Belt and braces: no job in this workflow may touch api.ibb.gov.tr. The gateway 503s
  # after ~15 rapid calls and İETT documents 100 requests/hour, both of which are shared
  # with every other consumer of this public data. CI must never spend that budget.
  NABIZ_OFFLINE: "1"

# An explicit shell makes GitHub run every step with `bash -eo pipefail`; the implicit default
# is `bash -e`, where `a | b` passes whenever `b` does and a failing `a` goes unseen.
defaults:
  run:
    shell: bash

jobs:
  python:
    name: Lint, test, guardrails and MCP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Cache the uv download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.12-

      - name: Install uv
        # One release, from PyPI, checked against the wheel hashes committed in
        # .github/requirements-uv.txt: a wheel whose bytes differ fails here instead of
        # running. Wheels only, so pip never builds anything. pip puts `uv` next to the
        # Python that setup-python installed, which is already on PATH.
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary :all: --require-hashes -r .github/requirements-uv.txt
          uv --version

      - name: Cache the virtualenv
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .venv
          # No restore-keys on purpose: a venv restored against a different dependency set
          # would install on top of stale wheels and hide a broken pyproject.toml. The
          # workflow file is in the key too, because the extras this job installs are named
          # here and not in pyproject.toml — changing them has to invalidate the venv — and so
          # is the uv pin, because another uv may resolve the same ranges differently.
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml', '.github/requirements-uv.txt') }}

      - name: Create the venv and install the project
        id: install
        # `uv venv` recreates the environment, which would defeat the cache above, so it only
        # runs when the restored venv is missing or unusable — a cached venv whose interpreter
        # symlink points at a hosted-tool-cache Python that has since been patched away looks
        # present but cannot run, and would fail the install with a confusing error. The
        # editable install runs either way: it is cheap once the wheels are cached, and it
        # proves pyproject.toml still builds.
        #
        # `web` is installed alongside `dev` because the suite needs it: tests/test_web.py
        # imports `fastapi.testclient` at module scope, so with `[dev]` alone pytest aborts
        # during collection ("Interrupted: 1 error during collection", exit 2) and the whole
        # test step is red. `collector` and `agent` are deliberately NOT installed — those
        # tests stub their SDKs in sys.modules and pass without the Azure/OpenAI wheels, and
        # keeping them out is what proves that claim on every run.
        run: |
          if ! .venv/bin/python -c "" 2>/dev/null; then
            rm -rf .venv
            uv venv -p 3.12 .venv
          fi
          uv pip install --python .venv/bin/python -e ".[dev,web]"

      - name: Ruff lint (gate)
        run: .venv/bin/ruff check src/ scripts/ tests/ .github/scripts/ eval/

      - name: Ruff format check (advisory)
        # Deliberately non-blocking. The project sets line-length 130 and wraps long
        # expressions by hand for readability; `ruff format` would join most of them back
        # into single lines. That is a style disagreement, not a defect, so it is reported
        # and not enforced. `ruff check` above is the real gate. Reasoning in the README.
        continue-on-error: true
        run: .venv/bin/ruff format --check --diff src/ scripts/ tests/

      - name: Pytest
        # GTFS comes from the committed tests/fixtures/gtfs_mini, not the gitignored
        # data/reference/gtfs that only exists on a laptop (see tests/conftest.py).
        run: .venv/bin/python -m pytest -q --junitxml=reports/junit.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pytest-junit
          path: reports/junit.xml
          # warn, not error: if pytest dies during collection there is no XML to upload,
          # and a second red step would only obscure the real failure above.
          if-no-files-found: warn
          retention-days: 14

      - name: MCP server smoke test
        # The tests exercise the tool layer; this exercises the server that ships. It builds
        # the real MCP server offline, requires at least 12 tools, each with a JSON-schema
        # input whose parameters have real names (never args/kwargs), and prints them. The
        # count is a floor: new tools land without editing CI. `ibb-mcp --help` proves the
        # console script that `uvx ibb-mcp` depends on was installed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          .venv/bin/ibb-mcp --help > /dev/null
          .venv/bin/python .github/scripts/mcp_smoke.py

      - name: Guardrails
        # Regression fences for incidents this project has already had: plates past the
        # parser or real plates in fixtures, schemas collapsing to (*args, **kwargs), İBB
        # calls bypassing PoliteClient, secrets, personal e-mail or home paths, AI credit
        # in files, unsourced README numbers. No network, no git history; see the script.
        # Runs even when lint or tests failed, so one push reports every broken fence.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python scripts/guardrails.py

      - name: Architecture fences
        # Import layers (DECISIONS #8: ibb_mcp imports nothing from nabiz), no cycles, declared
        # dependency sets, one meaning per public name, no private imports, and ratchets: a
        # module, class or function over its budget may shrink, never grow. Baseline:
        # scripts/architecture_baseline.json. Uses the ruff installed above; no network.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python scripts/check_architecture.py

      - name: Web budget
        # First-party bytes, no third-party render-blocking resource, fonts, layout-free motion,
        # colour tokens, module sizes: static reads of src/nabiz/web/static, no network. The
        # default mode fails on any finding that is not a listed redesign target, on a target
        # count that grew, and on a target that was met but is still listed, so the table only
        # shrinks. It switches to --strict once TARGETS_BY_CHECK is empty.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/python scripts/check_web_budget.py

  authorship:
    name: Authorship gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The pushed range has to be walkable, and a shallow clone holds one commit.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check the commits being pushed or proposed
        # Only the new commits are checked, never the whole history: 19 early commits carry
        # a personal address and rewriting them is the owner's decision (README). The SHAs
        # travel through env, not ${{ }} inside the script, so no event field is ever
        # interpolated into shell code.
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python scripts/check_authorship.py "$PR_BASE..$PR_HEAD"
            exit $?
          fi
          # A force-push leaves the previous tip unreachable, so the clone above does not
          # have it. GitHub still serves it by SHA until it is garbage-collected; without it
          # the script checks the pushed tip alone and says so.
          case "$PUSH_BEFORE" in
            *[!0]*)
              git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
                || git fetch --quiet --no-tags origin "$PUSH_BEFORE" 2>/dev/null \
                || echo "::warning::previous tip $PUSH_BEFORE is not fetchable; checking the pushed tip only"
              ;;
          esac
          python scripts/check_authorship.py --push "$PUSH_BEFORE" "$PUSH_AFTER"

  bicep:
    name: Bicep build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # `hashFiles` is evaluated against the checked-out workspace, so this guard has to sit
      # on the steps and not on the job — at job level the workspace is still empty and the
      # expression would always be false. The guard keeps the workflow correct on branches
      # and history where infra/ does not exist: there the job reports and passes.
      - name: Compile the Bicep templates
        # Not continue-on-error: `az bicep build` is a local compile. It needs no Azure
        # login, no subscription and no secret, so a failure here is a real template error.
        if: hashFiles('infra/main.bicep') != ''
        run: |
          az bicep install
          az bicep version
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "infra/main.bicep compiled cleanly"

      - name: No Bicep templates yet
        if: hashFiles('infra/main.bicep') == ''
        run: echo "infra/main.bicep does not exist yet — nothing to compile."
