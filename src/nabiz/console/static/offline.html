<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nabız: bağlantı yok</title>
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/citizen.css">
<script type="module" src="/js/pwa.js"></script>
<script type="module" src="/js/mock_calls.js"></script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="topbar-brand" href="/">İstanbul Nabız</a>
    <div class="topbar-actions"><span class="topbar-role">Resmî İBB hizmeti değildir</span></div>
  </div>
</header>
<div class="wrap" id="pwa-bar">
  <div class="band" role="note">
    <p>Bağımsız öğrenci projesi; resmî İBB hizmeti değildir. Bu sayfada yapay zekâ cevabı yok.</p>
  </div>
  <div class="callout callout-warn" id="pwa-offline-band" role="status">
    <div><p class="callout-title">Bağlantı yok.</p><p id="pwa-band-detail">Bu cihazda kayıtlı kart yok.</p></div>
  </div>
  <p class="status-line" id="pwa-status" role="status" hidden></p>
</div>
<main class="wrap" id="main" tabindex="-1">
  <section aria-labelledby="offline-title">
    <h1 id="offline-title">Bağlantı yok</h1>
    <p><a class="btn btn-primary" href="tel:153">153'ü ara</a></p>
  </section>
  <section aria-labelledby="offline-cards-title">
    <h2 id="offline-cards-title">Son kayıtlı kartlar</h2>
    <div class="cards" id="offline-cards"></div>
  </section>
  <p><a href="/">Ana sayfaya dön</a></p>
</main>
</body>
</html>
