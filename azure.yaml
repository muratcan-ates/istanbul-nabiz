# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# İstanbul Nabız — `azd up` provisions infra/main.bicep and deploys the MCP server image.
#
# azd finds a service's target resource by the `azd-service-name` tag set in Bicep:
#   mcp -> Microsoft.App/containerApps tagged azd-service-name: mcp
#
# The collector is not an azd service. Since DECISIONS #10 it runs as five scheduled
# Container Apps Jobs from the SAME image as the MCP server, with a different command. azd
# maps one service to one tagged resource, so five jobs would mean five services and five
# remote builds of one Dockerfile. Instead, after `azd deploy mcp` azd records the image it
# pushed as SERVICE_MCP_IMAGE_NAME, infra/main.parameters.json hands that back to Bicep, and
# the next `azd provision` creates or updates the jobs with it. On a brand-new environment
# that means: `azd up` (the jobs are skipped — there is no image yet), then `azd provision`.
# docs/deploy.md §4 is the runbook.
#
# The Functions collector that used to be the `collector` service here is off by default
# (deployCollectorFunction) and was never deployable as packaged; see docs/deploy.md §5.

name: istanbul-nabiz
metadata:
  template: istanbul-nabiz@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  # The MCP server, and — from the same image — the collector jobs. `remoteBuild: true`
  # builds the image in Azure Container Registry, so no local Docker daemon is needed —
  # which matters, because the dev machine is arm64 and the image has to be linux/amd64.
  # .dockerignore keeps the upload to the files the Dockerfile copies.
  mcp:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
    hooks:
      # The jobs keep running the previous image until the next provision picks up the new
      # SERVICE_MCP_IMAGE_NAME. Printed rather than automated: a provision is a deliberate act.
      postdeploy:
        posix:
          shell: sh
          continueOnError: true
          run: |
            echo ""
            echo "MCP image deployed. The collector jobs pick it up on the next: azd provision"
            echo ""

hooks:
  # Prints the one command that cannot be expressed in Bicep: the Azure Data Explorer free
  # cluster has no ARM resource provider (DECISIONS #1), so its ingestion grant is written
  # by hand against the collector's client id. Also says whether the collector jobs exist
  # yet, because on a new environment the first provision cannot create them.
  postprovision:
    posix:
      shell: sh
      continueOnError: true
      run: |
        # Plain $VAR, never ${VAR}: azd performs its own ${...} substitution on this file
        # before the shell ever sees it, so ${VAR:-default} would be mangled.
        echo ""
        echo "MCP server:  $SERVICE_MCP_URI"
        echo "Lake:        $NABIZ_LAKE_URL"
        echo ""
        if [ "$NABIZ_COLLECTOR_JOBS_DEPLOYED" = "true" ]; then
          echo "Collector:   Container Apps Jobs deployed (az containerapp job list -g $AZURE_RESOURCE_GROUP -o table)."
          echo "             If the laptop collector still runs, stop it: make collect-stop. Two collectors"
          echo "             spend two İETT budgets against one limit (docs/deploy.md section 4.3)."
        else
          echo "Collector:   NOT deployed yet. The jobs need an image: run 'azd deploy mcp', then 'azd provision'."
        fi
        echo ""
        echo "Azure Data Explorer is NOT provisioned by this template (the free cluster has no"
        echo "ARM provider). Create it at https://dataexplorer.azure.com/freecluster, paste"
        echo "kql/schema.kql into its query window, then run this there, against database $NABIZ_KUSTO_DB:"
        echo ""
        echo "  .add database $NABIZ_KUSTO_DB ingestors ('aadapp=$NABIZ_COLLECTOR_CLIENT_ID;$AZURE_TENANT_ID')"
        echo ""
        echo "Then: azd env set NABIZ_KUSTO_URI https://<cluster>.<region>.kusto.windows.net"
        echo "      azd provision"
        echo ""
