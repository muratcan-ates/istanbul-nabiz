# Erişilebilir yolculuk: Metro İstanbul'un asansör ve yürüyen merdiven kaydından doğan kurallar.
# The one rule catalog: src/nexus_core/missions.py loads it, the console routes by it, and every
# screen that names a rule (R-01 ... R-06) reads its id from here.
#
# Each rule is one readable if-then: "EĞER <when> O ZAMAN <then>". `path = "reflex"` closes the
# signal with the rule alone; `path = "arena"` drafts a card for the simulated operator. A rule
# whose card cannot be filled (a field is missing) never publishes a half-empty card: the signal
# goes to a person instead. Actions come only from nexus_core.missions.ACTION_CATALOG; nothing
# is evaluated.
#
# Field names: missions/README.md. ibb_mcp.accessibility builds them (signal_candidates,
# stale_signal) and the console wraps them as nexus_core signals.
#
# Card texts never say an elevator "works": the most the data supports is "İBB kaydında arıza
# yok". İBB's Date field is "İBB kaydındaki tarih", never presented as when the fault began.
# Thresholds (window, repeat count, 24 hours) are design parameters, not measured values.

[mission]
id = "erisilebilir-yolculuk"
title = "Erişilebilir yolculuk"
intent = "Herkes için, her zaman, her yerde: asansörü kullanılamayan istasyon için adımsız alternatifi kaynağı ve veri yaşıyla vermek; kritik durumu gerekçesiyle İBB çalışanına getirmek."
reviewed_on = 2026-09-25

[escalation]
# The same equipment seen in 3 separate outages (outage_id) within 14 days goes to a person.
window_hours = 336
repeat_threshold = 3
critical_kinds = ["hub_faults", "long_outage"]

# R-01 EĞER bir asansör kullanılamıyor VE aynı hatta ya da bir aktarmada asansörü İBB kaydında
# arızasız bir istasyon bulunduysa O ZAMAN alternatifi taslak olarak İBB çalışanına getir.
# The first card of an outage waits for a person; the approval binds that text to the outage
# (OA-<outage_id>, nexus_core/approved.py), and later snapshots of the same outage close by
# reflex after the run-time check. One line (`path = "reflex"`) makes every one a reflex.
[[rules]]
id = "R-01"
path = "arena"
expires_days = 30

[rules.when]
kind = "equipment_fault"
conditions = [
  { field = "equipment_type", op = "eq", value = "elevator" },
  { field = "alternative_station", op = "present" },
]

[rules.then]
action = "publish_alternative"
card_kind = "alternative"
title = "Adımsız erişim: {station}"
card_template = "İBB kaydına göre {station} istasyonunda bir asansör kullanılamıyor. İBB kaydında asansör arızası görünmeyen en yakın istasyon: {alternative_station} ({alternative_line}). {station} ile {alternative_station} arası tahminen {extra_minutes} dk (mesafeye dayalı tahmin; varış noktasına dönüş yolu dahil değil)."

# R-02 EĞER bir asansör kullanılamıyor VE adımsız alternatif bulunamadıysa O ZAMAN İBB çalışanına
# getir; alternatif uydurulmaz.
[[rules]]
id = "R-02"
path = "arena"
expires_days = 30

[rules.when]
kind = "equipment_fault"
conditions = [
  { field = "equipment_type", op = "eq", value = "elevator" },
  { field = "alternative_station", op = "absent" },
]

[rules.then]
action = "publish_card"
card_kind = "metro_equipment"
card_template = "İBB kaydına göre {station} istasyonunda bir asansör kullanılamıyor. Adımsız alternatif doğrulanamadı."

# R-03 EĞER yürüyen merdiven kullanılamıyor O ZAMAN bilgi kartını kuralla yayımla.
[[rules]]
id = "R-03"
path = "reflex"
expires_days = 30

[rules.when]
kind = "equipment_fault"
conditions = [{ field = "equipment_type", op = "eq", value = "escalator" }]

[rules.then]
action = "publish_card"
card_kind = "metro_equipment"
card_template = "{station} istasyonunda yürüyen merdiven kullanılamıyor (İBB kaydı)."

# R-04 EĞER Metro ekipman verisi bayatsa O ZAMAN son bilinen durumu yaşıyla göster ve
# "doğrulanamadı" yaz.
[[rules]]
id = "R-04"
path = "reflex"
expires_days = 30

[rules.when]
kind = "source_stale"
conditions = [{ field = "source", op = "eq", value = "metro_equipment" }]

[rules.then]
action = "schedule_mode"
card_kind = "metro_equipment"
title = "Metro ekipman durumu doğrulanamadı"
card_template = "Doğrulanamadı: Metro ekipman kaydı en son {age_text} okundu. Son bilinen durum: {last_known_text}"

# R-05 EĞER aynı aktarma merkezinde en az 2 ekipman kullanılamıyorsa O ZAMAN İBB çalışanına getir.
[[rules]]
id = "R-05"
path = "arena"
expires_days = 30

[rules.when]
kind = "hub_faults"
conditions = [{ field = "fault_count", op = "gte", value = 2 }]

[rules.then]
action = "publish_card"
card_kind = "metro_equipment"
title = "{hub} aktarma merkezinde {fault_count} ekipman kullanılamıyor"
card_template = "İBB kaydına göre {hub} aktarma merkezinde {fault_count} ekipman kullanılamıyor: {equipment_list}."

# R-06 EĞER İBB kaydındaki tarihten bu yana 24 saatten uzun geçtiyse O ZAMAN İBB çalışanına getir.
# The Date field's meaning is undocumented: the card says so and never calls it the fault's start.
[[rules]]
id = "R-06"
path = "arena"
expires_days = 30

[rules.when]
kind = "long_outage"
conditions = [{ field = "outage_hours", op = "gt", value = 24 }]

[rules.then]
action = "publish_card"
card_kind = "metro_equipment"
title = "{station} istasyonunda uzun süren kayıt"
card_template = "{text} İBB kaydındaki tarihten bu yana {outage_hours} saat geçti. Tarih alanının anlamı belgelenmemiştir; arızanın başladığı an olduğu doğrulanmadı."
